<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="666" viewBox="0 0 1010 666" fill="none">
  <defs>
    <filter id="glow-ru" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Highlight Area on Russia Territory -->
  <ellipse cx="640" cy="215" rx="140" ry="55" fill="rgba(236, 72, 153, 0.18)" filter="url(#glow-ru)" />
  <!-- Beacon Ripple at Moscow -->
  <g>
    <circle cx="565" cy="245" r="8" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.8">
      <animate attributeName="r" from="4" to="28" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.9" to="0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="565" cy="245" r="11" fill="rgba(236, 72, 153, 0.25)" />
    <circle cx="565" cy="245" r="5" fill="#ec4899" />
    <circle cx="565" cy="245" r="2" fill="#ffffff" />
  </g>
  <!-- Interactive Pin Card -->
  <g transform="translate(490, 200)">
    <rect width="152" height="32" rx="16" fill="rgba(15, 10, 24, 0.94)" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="16" cy="16" r="4.5" fill="#22c55e" />
    <text x="30" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.5">🇷🇺 HYDRA ESPORT</text>
  </g>
</svg>
