<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="666" viewBox="0 0 1010 666" fill="none">
  <defs>
    <filter id="glow-dz" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Highlight Area on Algeria Territory -->
  <ellipse cx="490" cy="385" rx="35" ry="42" fill="rgba(225, 29, 72, 0.22)" filter="url(#glow-dz)" />
  <!-- Beacon Ripple at Algiers -->
  <g>
    <circle cx="492" cy="356" r="8" fill="none" stroke="#e11d48" stroke-width="2" opacity="0.8">
      <animate attributeName="r" from="4" to="26" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.9" to="0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="492" cy="356" r="10" fill="rgba(225, 29, 72, 0.25)" />
    <circle cx="492" cy="356" r="5" fill="#e11d48" />
    <circle cx="492" cy="356" r="2" fill="#ffffff" />
  </g>
  <!-- Interactive Pin Card -->
  <g transform="translate(417, 312)">
    <rect width="150" height="32" rx="16" fill="rgba(20, 10, 15, 0.94)" stroke="#e11d48" stroke-width="1.5" />
    <circle cx="16" cy="16" r="4.5" fill="#22c55e" />
    <text x="30" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.5">🇩🇿 CHAZ EYEWEAR</text>
  </g>
</svg>
