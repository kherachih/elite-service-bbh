<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="666" viewBox="0 0 1010 666" fill="none">
  <defs>
    <filter id="glow-ca" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Highlight Area -->
  <circle cx="240" cy="190" r="75" fill="rgba(56, 189, 248, 0.18)" filter="url(#glow-ca)" />
  <!-- Beacon Ripple -->
  <g>
    <circle cx="265" cy="225" r="10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8">
      <animate attributeName="r" from="6" to="36" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.9" to="0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="265" cy="225" r="14" fill="rgba(56, 189, 248, 0.25)" />
    <circle cx="265" cy="225" r="6" fill="#38bdf8" />
    <circle cx="265" cy="225" r="2.5" fill="#ffffff" />
  </g>
  <!-- Interactive Pin Card -->
  <g transform="translate(180, 165)">
    <rect width="180" height="34" rx="17" fill="rgba(10, 15, 29, 0.94)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="18" cy="17" r="4.5" fill="#22c55e" />
    <text x="32" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.5">🇨🇦 CANADIAN MUSCLE</text>
  </g>
</svg>